<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone 18 Pro Max — iSakha</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #08080a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  .card {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    max-width: 1180px;
    width: 100%;
    background: #101014;
    border-radius: 28px;
    overflow: hidden;
    box-shadow:
      0 40px 100px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.05);
  }

  .viewer {
    position: relative;
    background: var(--viewer-bg,
      radial-gradient(circle at 50% 35%, #2a1a24 0%, #10080c 45%, #08080a 100%));
    min-height: 620px;
    overflow: hidden;
    transition: background 0.6s ease;
  }

  .viewer::after {
    content: "";
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 40px;
    background: radial-gradient(ellipse, var(--glow, rgba(180,60,80,0.35)) 0%, transparent 70%);
    filter: blur(24px);
    z-index: 0;
    pointer-events: none;
    transition: background 0.6s ease;
  }

  .iframe-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 1;
  }

  .iframe-wrap iframe {
    width: 160%;
    height: 160%;
    border: none;
    transform: scale(0.5);
    transform-origin: center center;
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -85%;
    margin-left: -80%;
  }

  .top-badge {
    position: absolute;
    top: 22px;
    left: 22px;
    z-index: 3;
    display: flex;
    gap: 8px;
  }

  .badge {
    padding: 7px 14px;
    font-size: 11px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    background: var(--badge-bg, rgba(107, 37, 48, 0.85));
    color: var(--badge-color, #f5d5d8);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.08);
    transition: background 0.5s ease, color 0.5s ease;
  }

  .badge.new {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  .info {
    padding: 44px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: #101014;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.6px;
    line-height: 1.15;
  }

  .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.45);
    margin-top: 6px;
  }

  .rating {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.05);
    padding: 6px 10px;
    border-radius: 10px;
    white-space: nowrap;
  }

  .rating .star { color: #f5b944; }

  .section-label {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .colors-row {
    display: flex;
    gap: 10px;
  }

  .color-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .color-dot:hover { transform: scale(1.1); }
  .color-dot.active { border-color: #fff; transform: scale(1.12); }

  .color-dot.burgundy { background: linear-gradient(135deg, #6b2530, #2e0e15); }
  .color-dot.silver   { background: linear-gradient(135deg, #e8e8ec, #a8a8b0); }
  .color-dot.glacier  { background: linear-gradient(135deg, #7a9bc4, #3d5a80); }
  .color-dot.black    { background: linear-gradient(135deg, #3a3a42, #0a0a0c); }

  .options-row {
    display: flex;
    gap: 8px;
  }

  .option-btn {
    flex: 1;
    padding: 12px 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
    font-family: inherit;
  }

  .option-btn:hover {
    background: rgba(255,255,255,0.07);
    color: #fff;
  }

  .option-btn.active {
    background: var(--storage-bg-active, rgba(107, 37, 48, 0.4));
    border-color: var(--storage-border-active, rgba(180, 80, 100, 0.6));
    color: #fff;
  }

  .option-btn small {
    display: block;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
  }

  .price-block {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 16px 0;
    border-top: 1px solid rgba(255,255,255,0.07);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .price {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1px;
  }

  .old-price {
    font-size: 16px;
    color: rgba(255,255,255,0.35);
    text-decoration: line-through;
  }

  .discount {
    margin-left: auto;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(74, 222, 128, 0.15);
    color: #4ade80;
    border-radius: 8px;
  }

  .perks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 18px;
  }

  .perk {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
  }

  .perk svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    stroke: #4ade80;
    fill: none;
    stroke-width: 2;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: auto;
    padding-top: 6px;
  }

  .btn-primary {
    padding: 17px;
    background: var(--btn-grad, linear-gradient(135deg, #7a2a38, #4a1520));
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.5s ease;
    box-shadow: 0 10px 30px var(--btn-shadow, rgba(107,37,48,0.4));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px var(--btn-shadow, rgba(107,37,48,0.55));
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    padding: 14px;
    background: transparent;
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.04);
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }

  @media (max-width: 860px) {
    .card { grid-template-columns: 1fr; }
    .viewer { min-height: 420px; }
    .info { padding: 32px 24px; gap: 18px; }
    .title { font-size: 24px; }
    .price { font-size: 30px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="viewer" id="viewer">
      <div class="iframe-wrap" id="iframeWrap"></div>

      <div class="top-badge">
        <div class="badge" id="colorBadge">Burgundy</div>
        <div class="badge new">Новинка 2026</div>
      </div>
    </div>

    <div class="info">
      <div class="header">
        <div>
          <h1 class="title">iPhone 18 Pro Max</h1>
          <p class="subtitle">Titanium · 2026 · 6.9" OLED</p>
        </div>
        <div class="rating">
          <span class="star">★</span> 4.9 <span style="opacity:0.4;">(127)</span>
        </div>
      </div>

      <div>
        <div class="section-label">Цвет — <span id="colorName">Burgundy</span></div>
        <div class="colors-row">
          <div class="color-dot burgundy active" data-color="burgundy"></div>
          <div class="color-dot silver"   data-color="silver"></div>
          <div class="color-dot glacier"  data-color="glacier"></div>
          <div class="color-dot black"    data-color="black"></div>
        </div>
      </div>

      <div>
        <div class="section-label">SIM</div>
        <div class="options-row" id="simRow">
          <div class="option-btn active" data-sim="1sim-esim">1 SIM + eSIM</div>
          <div class="option-btn" data-sim="esim">Только eSIM</div>
        </div>
      </div>

      <div>
        <div class="section-label">Память</div>
        <div class="options-row" id="storageRow">
          <div class="option-btn active" data-price="149990">256 ГБ <small>149 990 ₽</small></div>
          <div class="option-btn" data-price="169990">512 ГБ <small>169 990 ₽</small></div>
          <div class="option-btn" data-price="199990">1 ТБ <small>199 990 ₽</small></div>
        </div>
      </div>

      <div class="price-block">
        <div class="price" id="priceDisplay">149 990 ₽</div>
        <div class="old-price" id="oldPriceDisplay">169 990 ₽</div>
        <div class="discount" id="discountDisplay">−12%</div>
      </div>

      <div class="perks">
        <div class="perk">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          В наличии в Якутске
        </div>
        <div class="perk">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          Гарантия 1 год
        </div>
        <div class="perk">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          Доставка по городу
        </div>
        <div class="perk">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          Trade-in
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c0-2.8 2.3-4.1 2.4-4.2-1.3-1.9-3.3-2.2-4-2.2-1.7-.2-3.3 1-4.2 1-.9 0-2.2-1-3.6-.9-1.9 0-3.6 1.1-4.6 2.8-2 3.4-.5 8.4 1.4 11.2.9 1.3 2 2.8 3.5 2.8 1.4-.1 1.9-.9 3.6-.9s2.2.9 3.6.9c1.5 0 2.4-1.4 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.5zM14.7 5.4c.8-.9 1.3-2.2 1.1-3.5-1.1.1-2.4.7-3.2 1.7-.7.8-1.3 2.1-1.2 3.4 1.2.1 2.5-.7 3.3-1.6z"/></svg>
          Написать в WhatsApp
        </button>
        <button class="btn-secondary">Позвонить · +7 (999) 123-45-67</button>
      </div>
    </div>
  </div>

<script>
  const models = {
    burgundy: {
      name: 'Burgundy',
      src: 'https://sketchfab.com/models/604acc18b5d5455d820a16359b45b003/embed?autospin=1&autostart=1&transparent=1',
      viewerBg: 'radial-gradient(circle at 50% 35%, #2a1a24 0%, #10080c 45%, #08080a 100%)',
      glow: 'rgba(180,60,80,0.35)',
      badgeBg: 'rgba(107, 37, 48, 0.85)',
      badgeColor: '#f5d5d8',
      btnGrad: 'linear-gradient(135deg, #7a2a38, #4a1520)',
      btnShadow: 'rgba(107,37,48,0.45)',
      storageBgActive: 'rgba(107, 37, 48, 0.5)',
      storageBorderActive: 'rgba(180, 80, 100, 0.7)'
    },
    silver: {
      name: 'Silver',
      src: 'https://sketchfab.com/models/d383a366cc9e464ba4b24e5ddb996866/embed?autospin=1&autostart=1&transparent=1',
      viewerBg: 'radial-gradient(circle at 50% 35%, #2a2a30 0%, #14141a 45%, #08080a 100%)',
      glow: 'rgba(200,200,220,0.25)',
      badgeBg: 'rgba(180, 180, 190, 0.85)',
      badgeColor: '#1a1a20',
      btnGrad: 'linear-gradient(135deg, #6a6a72, #3a3a42)',
      btnShadow: 'rgba(120,120,130,0.4)',
      storageBgActive: 'rgba(160, 160, 170, 0.35)',
      storageBorderActive: 'rgba(200, 200, 210, 0.6)'
    },
    glacier: {
      name: 'Glacier Blue',
      src: 'https://sketchfab.com/models/86dc4a625ae2444c97cf8469a6f6f016/embed?autospin=1&autostart=1&transparent=1',
      viewerBg: 'radial-gradient(circle at 50% 35%, #1a2a3c 0%, #0c141e 45%, #08080a 100%)',
      glow: 'rgba(100,150,220,0.35)',
      badgeBg: 'rgba(80, 120, 180, 0.85)',
      badgeColor: '#e0ecf8',
      btnGrad: 'linear-gradient(135deg, #4a6a9a, #2a3f5a)',
      btnShadow: 'rgba(60,100,160,0.45)',
      storageBgActive: 'rgba(80, 120, 180, 0.4)',
      storageBorderActive: 'rgba(120, 170, 230, 0.65)'
    },
    black: {
      name: 'Black',
      src: 'https://sketchfab.com/models/8fd804a9b0ea49249de3f1e0450fbc9c/embed?autospin=1&autostart=1&transparent=1',
      viewerBg: 'radial-gradient(circle at 50% 35%, #1e1e24 0%, #0c0c10 45%, #08080a 100%)',
      glow: 'rgba(80,80,100,0.3)',
      badgeBg: 'rgba(40, 40, 48, 0.9)',
      badgeColor: '#d8d8dc',
      btnGrad: 'linear-gradient(135deg, #3a3a42, #1a1a20)',
      btnShadow: 'rgba(40,40,50,0.5)',
      storageBgActive: 'rgba(60, 60, 72, 0.5)',
      storageBorderActive: 'rgba(110, 110, 130, 0.65)'
    }
  };

  const iframeWrap = document.getElementById('iframeWrap');
  const viewer = document.getElementById('viewer');
  const colorBadge = document.getElementById('colorBadge');
  const colorName = document.getElementById('colorName');
  const priceDisplay = document.getElementById('priceDisplay');
  const oldPriceDisplay = document.getElementById('oldPriceDisplay');
  const discountDisplay = document.getElementById('discountDisplay');

  function formatPrice(n) {
    return n.toLocaleString('ru-RU') + ' ₽';
  }

  function updatePrice(price) {
    const oldPrice = Math.round(price * 1.13);
    const discount = Math.round((1 - price / oldPrice) * 100);
    priceDisplay.textContent = formatPrice(price);
    oldPriceDisplay.textContent = formatPrice(oldPrice);
    discountDisplay.textContent = '−' + discount + '%';
  }

  function setModel(colorKey) {
    const m = models[colorKey];
    if (!m) return;

    iframeWrap.innerHTML = `
      <div class="sketchfab-embed-wrapper">
        <iframe
          title="Apple iPhone 18 Pro Max ${m.name} 2026"
          frameborder="0"
          allowfullscreen
          mozallowfullscreen="true"
          webkitallowfullscreen="true"
          allow="autoplay; fullscreen; xr-spatial-tracking"
          xr-spatial-tracking
          execution-while-out-of-viewport
          execution-while-not-rendered
          web-share
          src="${m.src}">
        </iframe>
      </div>`;

    const iframe = iframeWrap.querySelector('iframe');
    iframe.style.cssText = `
      width: 160%;
      height: 160%;
      border: none;
      transform: scale(0.5);
      transform-origin: center center;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -85%;
      margin-left: -80%;
    `;

    viewer.style.setProperty('--viewer-bg', m.viewerBg);
    viewer.style.setProperty('--glow', m.glow);

    colorBadge.style.setProperty('--badge-bg', m.badgeBg);
    colorBadge.style.setProperty('--badge-color', m.badgeColor);
    colorBadge.textContent = m.name;
    colorName.textContent = m.name;

    document.documentElement.style.setProperty('--btn-grad', m.btnGrad);
    document.documentElement.style.setProperty('--btn-shadow', m.btnShadow);
    document.documentElement.style.setProperty('--storage-bg-active', m.storageBgActive);
    document.documentElement.style.setProperty('--storage-border-active', m.storageBorderActive);
  }

  document.querySelectorAll('.color-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      dot.classList.add('active');
      setModel(dot.dataset.color);
    });
  });

  document.querySelectorAll('#simRow .option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#simRow .option-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.querySelectorAll('#storageRow .option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#storageRow .option-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updatePrice(parseInt(btn.dataset.price, 10));
    });
  });

  setModel('burgundy');
</script>
</body>
</html>
