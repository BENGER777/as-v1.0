<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: #08080a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ===== ШАПКА ===== */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 18px 40px;
    background: rgba(8, 8, 10, 0.7);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: padding 0.3s;
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo svg { width: 22px; height: 26px; fill: #7a2a38; }

  .nav { display: flex; gap: 28px; }

  .nav a {
    color: rgba(255,255,255,0.65);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.15s;
  }

  .nav a:hover { color: #fff; }

  .cart-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.15s;
  }

  .cart-link:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }

  .cart-link svg { width: 16px; height: 16px; fill: currentColor; }

  .cart-link .count {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    background: #4ade80;
    color: #0a0a0c;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cart-link .count.hidden { display: none; }

  /* ===== ЗАГОЛОВОК ===== */
  .page-hero {
    padding: 140px 40px 40px;
    max-width: 1280px;
    margin: 0 auto;
    position: relative;
  }

  .page-hero::before {
    content: "";
    position: absolute;
    top: 0;
    right: 10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(122, 42, 56, 0.35), transparent 65%);
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }

  .breadcrumbs {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }

  .breadcrumbs a {
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    transition: color 0.15s;
  }

  .breadcrumbs a:hover { color: #fff; }

  .page-title {
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1.05;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
    background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.7) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .page-subtitle {
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    position: relative;
    z-index: 1;
  }

  /* ===== ОСНОВНАЯ ЧАСТЬ ===== */
  .cart-wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 40px 120px;
  }

  /* Пустая корзина */
  .empty {
    text-align: center;
    padding: 80px 20px;
    background: #101014;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 28px;
    position: relative;
    overflow: hidden;
  }

  .empty::before {
    content: "";
    position: absolute;
    top: -50%;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(122, 42, 56, 0.3), transparent 65%);
    filter: blur(60px);
    pointer-events: none;
  }

  .empty-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(122, 42, 56, 0.5), rgba(74, 21, 32, 0.5));
    border: 1px solid rgba(180, 80, 100, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .empty-icon svg {
    width: 36px;
    height: 36px;
    fill: none;
    stroke: #d46b7c;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .empty h2 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.8px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  .empty p {
    font-size: 15px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }

  .btn-primary {
    padding: 16px 32px;
    background: linear-gradient(135deg, #7a2a38, #4a1520);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: inherit;
    text-decoration: none;
    box-shadow: 0 12px 36px rgba(122, 42, 56, 0.5);
    position: relative;
    z-index: 1;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 48px rgba(122, 42, 56, 0.7);
  }

  /* Сетка */
  .cart-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 24px;
    align-items: start;
  }

  /* Список */
  .cart-items {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .cart-item {
    display: grid;
    grid-template-columns: 100px 1fr auto;
    gap: 20px;
    padding: 18px;
    background: #101014;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 20px;
    align-items: center;
    transition: all 0.3s;
    opacity: 0;
    transform: translateY(20px);
  }

  .cart-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .cart-item:hover {
    border-color: rgba(180, 80, 100, 0.3);
    box-shadow: 0 10px 40px rgba(122, 42, 56, 0.2);
  }

  .item-thumb {
    width: 100px;
    height: 100px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    flex-shrink: 0;
  }

  .item-thumb.burgundy { background: radial-gradient(circle, #5a1a26 0%, #1a0a10 100%); }
  .item-thumb.silver { background: radial-gradient(circle, #3a3a42 0%, #18181e 100%); }
  .item-thumb.glacier { background: radial-gradient(circle, #1e3148 0%, #0c141e 100%); }
  .item-thumb.black { background: radial-gradient(circle, #1e1e24 0%, #0a0a0c 100%); }

  .item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
  }

  .item-info { min-width: 0; }

  .item-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }

  .item-specs {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
  }

  .item-specs span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .item-specs span + span::before {
    content: "·";
    margin-right: 6px;
    color: rgba(255,255,255,0.2);
  }

  .item-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .item-price {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.4px;
    white-space: nowrap;
  }

  .item-remove {
    padding: 6px 10px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .item-remove:hover {
    background: rgba(255, 90, 90, 0.1);
    border-color: rgba(255, 90, 90, 0.4);
    color: #ff5a5a;
  }

  .item-remove svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* Sidebar */
  .cart-sidebar {
    position: sticky;
    top: 100px;
    background: #101014;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 24px;
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s;
  }

  .cart-sidebar.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .sidebar-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .sidebar-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    padding: 6px 0;
  }

  .sidebar-row b {
    color: #fff;
    font-weight: 600;
  }

  .sidebar-divider {
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 8px 0;
  }

  .sidebar-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 15px;
    color: rgba(255,255,255,0.6);
  }

  .sidebar-total b {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #fff;
  }

  /* Форма */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .form-label {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .form-input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
    outline: none;
  }

  .form-input::placeholder {
    color: rgba(255,255,255,0.3);
  }

  .form-input:focus {
    border-color: rgba(212, 107, 124, 0.6);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 3px rgba(122, 42, 56, 0.2);
  }

  .form-input.error {
    border-color: rgba(255, 90, 90, 0.7);
    background: rgba(255, 90, 90, 0.05);
  }

  textarea.form-input {
    resize: vertical;
    min-height: 70px;
    font-family: inherit;
  }

  /* Кнопка */
  .btn-checkout {
    width: 100%;
    padding: 17px;
    background: linear-gradient(135deg, #7a2a38, #4a1520);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 12px 36px rgba(122, 42, 56, 0.5);
  }

  .btn-checkout:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 16px 48px rgba(122, 42, 56, 0.7);
  }

  .btn-checkout:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-checkout svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .checkout-note {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    line-height: 1.5;
  }

  /* ===== ФУТЕР ===== */
  footer {
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 48px 40px;
  }

  .footer-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .footer-logo {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .footer-logo svg { width: 18px; height: 22px; fill: #7a2a38; }

  .footer-links { display: flex; gap: 28px; }

  .footer-links a {
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 13px;
    transition: color 0.15s;
  }

  .footer-links a:hover { color: #fff; }

  .footer-copy {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
  }

  /* ===== МОДАЛКА УСПЕХА ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: #101014;
    border: 1px solid rgba(180, 80, 100, 0.3);
    border-radius: 28px;
    padding: 48px 40px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    position: relative;
    overflow: hidden;
    transform: scale(0.85) translateY(20px);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
  }

  .modal-overlay.show .modal {
    transform: scale(1) translateY(0);
  }

  .modal::before {
    content: "";
    position: absolute;
    top: -50%;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(122, 42, 56, 0.5), transparent 65%);
    filter: blur(60px);
    pointer-events: none;
    animation: modalGlow 3s ease-in-out infinite;
  }

  @keyframes modalGlow {
    0%, 100% { opacity: 0.7; }
    50%      { opacity: 1; }
  }

  /* Галочка с рисованием */
  .modal-check {
    width: 88px;
    height: 88px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7a2a38, #4a1520);
    border: 2px solid rgba(212, 107, 124, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    box-shadow: 0 20px 50px rgba(122, 42, 56, 0.5);
    animation: checkPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes checkPop {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .modal-check::before {
    content: "";
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 107, 124, 0.35), transparent 70%);
    animation: pulseRing 2s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes pulseRing {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50%      { transform: scale(1.2); opacity: 1; }
  }

  .modal-check svg {
    width: 44px;
    height: 44px;
    fill: none;
    stroke: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: drawCheck 0.5s ease-out 0.3s forwards;
  }

  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  .modal h2 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.8px;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }

  .modal p {
    font-size: 15px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }

  .modal .modal-note {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }

  .modal-btn {
    padding: 15px 32px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    position: relative;
    z-index: 1;
  }

  .modal-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.25);
  }

  /* ===== АДАПТИВ ===== */
  @media (max-width: 1000px) {
    .cart-layout { grid-template-columns: 1fr; }
    .cart-sidebar { position: static; }
  }

  @media (max-width: 700px) {
    header { padding: 14px 20px; }
    .nav { display: none; }
    .page-hero { padding: 110px 20px 30px; }
    .cart-wrap { padding: 10px 20px 80px; }

    .cart-item {
      grid-template-columns: 80px 1fr;
      gap: 14px;
      padding: 14px;
    }

    .item-thumb { width: 80px; height: 80px; }

    .item-right {
      grid-column: 1 / -1;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .cart-sidebar { padding: 24px 20px; }
    .sidebar-total b { font-size: 24px; }

    .footer-inner { flex-direction: column; text-align: center; }

    .modal { padding: 40px 28px 32px; }
    .modal h2 { font-size: 22px; }
    .modal-check { width: 72px; height: 72px; }
    .modal-check svg { width: 36px; height: 36px; }
  }
</style>
</head>

  <!-- ШАПКА -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">

        iSakha
      </a>

      <nav class="nav">
        <a href="catalog.html">Каталог</a>
        <a href="index.html#about">О нас</a>
        <a href="index.html#contacts">Контакты</a>
      </nav>

      <a href="cart.html" class="cart-link">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        Корзина
        <span class="count hidden" id="cartCount">0</span>
      </a>
    </div>
  </header>

  <!-- ЗАГОЛОВОК -->
  <section class="page-hero">
    <div class="breadcrumbs">
      <a href="index.html">Главная</a>
      <span>·</span>
      <span style="color: rgba(255,255,255,0.7);">Корзина</span>
    </div>
    <h1 class="page-title">Корзина</h1>
    <p class="page-subtitle" id="pageSubtitle">Проверьте заказ и оформите доставку</p>
  </section>

  <!-- ОСНОВНАЯ ЧАСТЬ -->
  <section class="cart-wrap">
    <div id="cartContent"></div>
  </section>

  <!-- ФУТЕР -->
  <footer>
    <div class="footer-inner">
      <a href="index.html" class="footer-logo">
        <svg viewBox="0 0 24 30"><path d="M17.05 15.6c-.03-3.2 2.6-4.73 2.72-4.8-1.48-2.17-3.79-2.47-4.6-2.5-1.96-.2-3.82 1.15-4.82 1.15-1 0-2.53-1.12-4.16-1.09-2.14.03-4.11 1.25-5.21 3.16-2.22 3.85-.57 9.55 1.6 12.68 1.06 1.53 2.32 3.25 3.97 3.19 1.6-.07 2.2-1.03 4.13-1.03 1.93 0 2.47 1.03 4.16.99 1.72-.03 2.8-1.56 3.85-3.1 1.21-1.78 1.71-3.5 1.74-3.59-.04-.02-3.34-1.28-3.38-5.06zM14.03 6.4c.88-1.07 1.47-2.55 1.31-4.03-1.27.05-2.8.84-3.71 1.91-.81.94-1.53 2.45-1.34 3.9 1.42.11 2.86-.72 3.74-1.78z"/></svg>
        iSakha
      </a>

      <div class="footer-links">
        <a href="catalog.html">Каталог</a>
        <a href="cart.html">Корзина</a>
        <a href="index.html#about">О нас</a>
        <a href="index.html#contacts">Контакты</a>
      </div>

      <div class="footer-copy">© 2026 iSakha. Якутск.</div>
    </div>
  </footer>

  <!-- МОДАЛКА УСПЕХА -->
  <div class="modal-overlay" id="modalSuccess">
    <div class="modal">
      <div class="modal-check">
        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h2>Заказ оформлен!</h2>
      <p>Скоро с вами свяжутся в WhatsApp</p>
      <p class="modal-note">Обычно отвечаем в течение 15 минут</p>
      <button class="modal-btn" id="modalClose">Понятно</button>
    </div>
  </div>

<script>
  // ===== НАСТРОЙКИ =====
  const WHATSAPP_NUMBER = '79991234567';
  const STORAGE_KEY = 'isakha_cart';

  const PRODUCT_PHOTOS = {
    burgundy: 'https://cloudgadgets.ru/wp-content/uploads/2026/09/iphone-18-pro-burgundy-768x768.webp',
    silver:   'https://cloudgadgets.ru/wp-content/uploads/2026/09/iphone-18-pro-silver-768x768.webp',
    glacier:  'https://cloudgadgets.ru/wp-content/uploads/2026/09/iphone-18-pro-glacier-768x768.webp',
    black:    'https://cloudgadgets.ru/wp-content/uploads/2026/09/iphone-18-pro-black-768x768.webp'
  };

  // ===== КОРЗИНА =====
  function getCart() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch (e) { return []; }
  }

  function saveCart(cart) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
  }

  function formatPrice(n) {
    return n.toLocaleString('ru-RU') + ' ₽';
  }

  function updateCartCount() {
    const cart = getCart();
    const el = document.getElementById('cartCount');
    if (cart.length > 0) {
      el.textContent = cart.length;
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  function pluralItems(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'товар';
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'товара';
    return 'товаров';
  }

  function total(cart) {
    return cart.reduce((sum, item) => sum + item.price, 0);
  }

  // ===== ЗВУК ПОКУПКИ (синтез) =====
  function playBuySound() {
  try {
    const audio = new Audio('apple-pay.mp3'); // ← твой файл
    audio.volume = 0.6;
    audio.play().catch(() => {});
  } catch (e) {}
}

  // ===== МАСКА ТЕЛЕФОНА (только цифры) =====
  function formatPhone(value) {
    // Убираем всё кроме цифр
    let digits = value.replace(/\D/g, '');

    // Если начинается с 8 — меняем на 7
    if (digits.startsWith('8')) digits = '7' + digits.slice(1);
    // Если не начинается с 7 — добавляем
    if (digits && !digits.startsWith('7')) digits = '7' + digits;

    // Ограничиваем 11 цифрами
    digits = digits.slice(0, 11);

    // Собираем красивый формат
    let result = '';
    if (digits.length > 0) result = '+7';
    if (digits.length > 1) result += ' (' + digits.slice(1, 4);
    if (digits.length >= 5) result += ') ' + digits.slice(4, 7);
    if (digits.length >= 8) result += '-' + digits.slice(7, 9);
    if (digits.length >= 10) result += '-' + digits.slice(9, 11);

    return result;
  }

  // Привязка к полю телефона
  function bindPhoneInput(input) {
    input.addEventListener('input', (e) => {
      const formatted = formatPhone(e.target.value);
      e.target.value = formatted;
    });

    input.addEventListener('keydown', (e) => {
      // Разрешаем: backspace, delete, tab, escape, enter, стрелки, home, end
      const allowed = ['Backspace', 'Delete', 'Tab', 'Escape', 'Enter',
                       'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
                       'Home', 'End'];
      if (allowed.includes(e.key)) return;
      // Разрешаем Ctrl/Cmd + A/C/V/X
      if (e.ctrlKey || e.metaKey) return;
      // Разрешаем только цифры
      if (!/^\d$/.test(e.key)) e.preventDefault();
    });

    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData('text');
      e.target.value = formatPhone(pasted);
    });
  }

  // ===== ОТРИСОВКА =====
  function renderCart() {
    const cart = getCart();
    const wrap = document.getElementById('cartContent');
    const subtitle = document.getElementById('pageSubtitle');

    if (cart.length === 0) {
      subtitle.textContent = 'Пока пусто';
      wrap.innerHTML = `
        <div class="empty">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24">
              <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1z"/>
            </svg>
          </div>
          <h2>Корзина пуста</h2>
          <p>Добавьте iPhone — и мы привезём его к вам</p>
          <a href="catalog.html" class="btn-primary">
            Перейти в каталог
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
      `;
      return;
    }

    subtitle.textContent = `${cart.length} ${pluralItems(cart.length)} на сумму ${formatPrice(total(cart))}`;

    const itemsHTML = cart.map((item, i) => `
      <div class="cart-item" data-index="${i}">
        <div class="item-thumb ${item.color}">
          <img src="${PRODUCT_PHOTOS[item.color] || ''}" alt="${item.name}">
        </div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-specs">
            <span>${item.colorName}</span>
            <span>${item.storage}</span>
            <span>${item.sim}</span>
          </div>
        </div>
        <div class="item-right">
          <div class="item-price">${formatPrice(item.price)}</div>
          <button class="item-remove" data-index="${i}">
            <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            Удалить
          </button>
        </div>
      </div>
    `).join('');

    wrap.innerHTML = `
      <div class="cart-layout">
        <div class="cart-items" id="cartItems">${itemsHTML}</div>

        <aside class="cart-sidebar" id="cartSidebar">
          <div class="sidebar-title">Ваш заказ</div>

          <div>
            <div class="sidebar-row">
              <span>Товары (${cart.length})</span>
              <b>${formatPrice(total(cart))}</b>
            </div>
            <div class="sidebar-row">
              <span>Доставка по Якутску</span>
              <b style="color: #4ade80;">Бесплатно</b>
            </div>
          </div>

          <div class="sidebar-divider"></div>

          <div class="sidebar-total">
            <span>Итого</span>
            <b>${formatPrice(total(cart))}</b>
          </div>

          <div class="sidebar-divider"></div>

          <div class="form-group">
            <div class="form-label">Ваше имя</div>
            <input type="text" class="form-input" id="fieldName" placeholder="Иван" autocomplete="name">
          </div>

          <div class="form-group">
            <div class="form-label">Телефон</div>
            <input type="tel" class="form-input" id="fieldPhone" placeholder="+7 (___) ___-__-__" autocomplete="tel" inputmode="numeric">
          </div>

          <div class="form-group">
            <div class="form-label">Адрес доставки</div>
            <input type="text" class="form-input" id="fieldAddress" placeholder="ул. Ленина, 1, кв. 5" autocomplete="street-address">
          </div>

          <div class="form-group">
            <div class="form-label">Комментарий (необязательно)</div>
            <textarea class="form-input" id="fieldComment" placeholder="Удобное время, подъезд..."></textarea>
          </div>

          <button class="btn-checkout" id="btnCheckout">
            <svg viewBox="0 0 24 24"><path d="M17.5 14.4c0-2.8 2.3-4.1 2.4-4.2-1.3-1.9-3.3-2.2-4-2.2-1.7-.2-3.3 1-4.2 1-.9 0-2.2-1-3.6-.9-1.9 0-3.6 1.1-4.6 2.8-2 3.4-.5 8.4 1.4 11.2.9 1.3 2 2.8 3.5 2.8 1.4-.1 1.9-.9 3.6-.9s2.2.9 3.6.9c1.5 0 2.4-1.4 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.5zM14.7 5.4c.8-.9 1.3-2.2 1.1-3.5-1.1.1-2.4.7-3.2 1.7-.7.8-1.3 2.1-1.2 3.4 1.2.1 2.5-.7 3.3-1.6z"/></svg>
            Оформить заказ
          </button>

          <div class="checkout-note">
            Отправим заказ в WhatsApp — ответим в течение 15 минут
          </div>
        </aside>
      </div>
    `;

    // Анимация
    setTimeout(() => {
      document.querySelectorAll('.cart-item').forEach((el, i) => {
        setTimeout(() => el.classList.add('visible'), i * 60);
      });
      const sidebar = document.getElementById('cartSidebar');
      if (sidebar) sidebar.classList.add('visible');
    }, 50);

    // Удаление
    document.querySelectorAll('.item-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.index, 10);
        const c = getCart();
        c.splice(idx, 1);
        saveCart(c);
        updateCartCount();
        renderCart();
      });
    });

    // Привязка телефона
    const phoneInput = document.getElementById('fieldPhone');
    if (phoneInput) bindPhoneInput(phoneInput);

    // Оформление
    document.getElementById('btnCheckout').addEventListener('click', handleCheckout);
  }

  // ===== ОФОРМЛЕНИЕ =====
  function handleCheckout() {
    const cart = getCart();
    if (cart.length === 0) return;

    const name = document.getElementById('fieldName');
    const phone = document.getElementById('fieldPhone');
    const address = document.getElementById('fieldAddress');
    const comment = document.getElementById('fieldComment');

    [name, phone, address].forEach(el => el.classList.remove('error'));

    let valid = true;
    if (!name.value.trim()) { name.classList.add('error'); valid = false; }
    if (!phone.value.trim() || phone.value.replace(/\D/g, '').length < 11) {
      phone.classList.add('error'); valid = false;
    }
    if (!address.value.trim()) { address.classList.add('error'); valid = false; }

    if (!valid) {
      const firstError = document.querySelector('.form-input.error');
      if (firstError) firstError.focus();
      return;
    }

    // Сразу звук
    playBuySound();

    // Модалка
    const modal = document.getElementById('modalSuccess');
    modal.classList.add('show');

    // Сборка сообщения
    let message = '🛒 *Новый заказ с сайта iSakha*\n\n';
    message += `👤 *Имя:* ${name.value.trim()}\n`;
    message += `📞 *Телефон:* ${phone.value.trim()}\n`;
    message += `📍 *Адрес:* ${address.value.trim()}\n`;
    if (comment.value.trim()) {
      message += `💬 *Комментарий:* ${comment.value.trim()}\n`;
    }
    message += '\n━━━━━━━━━━━━━━━\n\n📦 *Товары:*\n\n';

    cart.forEach((item, i) => {
      message += `${i + 1}. ${item.name}\n`;
      message += `   Цвет: ${item.colorName}\n`;
      message += `   Память: ${item.storage}\n`;
      message += `   SIM: ${item.sim}\n`;
      message += `   Цена: ${formatPrice(item.price)}\n\n`;
    });

    message += '━━━━━━━━━━━━━━━\n';
    message += `💰 *Итого:* ${formatPrice(total(cart))}\n`;
    message += `🚚 Доставка: бесплатно по Якутску\n`;

    // Открываем WhatsApp
    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');

    // Очищаем корзину
    setTimeout(() => {
      saveCart([]);
      updateCartCount();
    }, 1000);
  }

  // Закрытие модалки
  document.getElementById('modalClose').addEventListener('click', () => {
    document.getElementById('modalSuccess').classList.remove('show');
    renderCart();
  });

  document.getElementById('modalSuccess').addEventListener('click', (e) => {
    if (e.target.id === 'modalSuccess') {
      e.target.classList.remove('show');
      renderCart();
    }
  });

  // ===== СТАРТ =====
  updateCartCount();
  renderCart();

  const header = document.querySelector('header');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 40) {
      header.style.padding = '12px 40px';
    } else {
      header.style.padding = '18px 40px';
    }
  });
</script>
</body>
